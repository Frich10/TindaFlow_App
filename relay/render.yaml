# Render.com service definition for the TindaFlow OTP relay (Brevo).
# Deploy: push this repo to GitHub, then "New +" -> "Blueprint" in Render.
services:
  - type: web
    name: tindaflow-otp-relay
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FROM_EMAIL
        value: tindaflowofficial@gmail.com
      - key: FROM_NAME
        value: "TindaFlow"
      # Set BREVO_API_KEY and RELAY_TOKEN as SECRET env vars in the Render
      # dashboard (do not commit them). They are intentionally left empty here.
      - key: BREVO_API_KEY
        sync: false
      - key: RELAY_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "5"